<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airline transfer: status and payment | Ghar to Health</title><link rel="icon" href="logo.png">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f7fbff;color:#12365d;line-height:1.6}.w{width:92%;max-width:560px;margin:30px auto}h1{font-size:24px;color:#0a396b;margin-bottom:6px}h3{margin:22px 0 8px;color:#0a396b}p,td,th{font-size:14px}.c{background:#fff;border:1px solid #d9ebf8;border-radius:16px;padding:18px;margin-top:14px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}input{width:100%;padding:10px 12px;border:1px solid #cfe0ee;border-radius:10px;font:inherit}.b{margin-top:14px;padding:11px 22px;border:0;border-radius:30px;background:#087ff5;color:#fff;font:inherit;font-weight:700;cursor:pointer}.b.r{background:#c62828}.b:disabled{opacity:.6}table{width:100%;border-collapse:collapse}td,th{border-top:1px solid #e3edf6;padding:8px;text-align:left}.err{color:#c62828}.ok{color:#1b7f3b;font-weight:600}.st{font-size:20px;font-weight:800;color:#087cf2}</style></head><body><main class="w">
<h1>Airline transfer: status &amp; payment</h1><p>Enter your Booking ID and mobile number. You paid an advance when booking; the balance is paid here after airline approval.</p>
<form class="c" id="f"><label for="i">Booking ID</label><input id="i" required><label for="p">Mobile number</label><input id="p" type="tel" required><button class="b" type="submit">Check</button><p class="err" id="e"></p></form>
<div class="c" id="r" hidden></div>
<h3>Cancellation and refund</h3><table id="pol"><tr><th>When</th><th>Refund</th></tr><tr><td colspan="2">Loading...</td></tr></table>
<p style="margin-top:8px;color:#5b7690">Refunds go back to the original payment method.</p></main>
<script>var $=function(s){return document.getElementById(s)},ID='',PH='';
var SL={received:'Request received',docs_ok:'Documents checked',airline_pending:'Waiting for airline approval',approved:'Airline approved. Please pay the balance',ticketed:'Ticket and stretcher booked',pickup:'Ambulance on the way',flown:'Flight departed',landed:'Landed. Ambulance heading to hospital',handed:'Handed over at the hospital',refused:'Cancelled. Full refund'};
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j})})}
function inr(n){return '\u20B9'+Number(n).toLocaleString('en-IN')}
var FEE=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function brk(s){var f=s.final,r=f.items.map(function(i){return '<tr><td>'+esc(i.label)+'</td><td>'+inr(i.amount)+'</td></tr>'}).join('');
 if(f.fee)r+='<tr><td>Platform fee ('+f.feePct+'%)</td><td>'+inr(f.fee)+'</td></tr>';if(f.gst)r+='<tr><td>GST ('+f.gstPct+'% on fee)</td><td>'+inr(f.gst)+'</td></tr>';
 r+='<tr><td><b>Total</b></td><td><b>'+inr(f.total)+'</b></td></tr><tr><td>Booking amount paid</td><td>- '+inr(s.fee)+'</td></tr>'+(s.paid?'<tr><td>Balance paid</td><td>'+inr(s.balance)+'</td></tr>':'<tr><td><b>Balance to pay</b></td><td><b>'+inr(s.balance)+'</b></td></tr>');
 return '<table style="margin-top:8px">'+r+'</table>'+((f.included||[]).length?'<p style="margin-top:8px"><b>Included:</b> '+f.included.map(esc).join(', ')+'</p>':'')+((f.notIncluded||[]).length?'<p><b>Not included:</b> '+f.notIncluded.map(esc).join(', ')+'</p>':'')}
fetch('/api/ambulance/air-policy').then(function(r){return r.json()}).then(function(p){var R=p.refund||{},f=inr(p.procFee||0);FEE=p.procFee||0;
 $('pol').innerHTML='<tr><th>When</th><th>Refund</th></tr>'+
 '<tr><td>Airline does not approve, or we cannot do the transfer</td><td>100% of everything paid</td></tr>'+
 '<tr><td>You cancel before the ticket is booked (before or after airline approval)</td><td>'+(R.approved||0)+'% of what you paid, minus a processing fee of '+f+'</td></tr>'+
 '<tr><td>You cancel after the ticket and escort are booked</td><td>'+(R.ticketed||0)+'% of what you paid, minus a processing fee of '+f+'</td></tr>'+
 '<tr><td>After the flight has departed</td><td>No cancellation</td></tr>'}).catch(function(){$('pol').innerHTML='<tr><td>Please call us for the refund policy.</td></tr>'});
function load(){post('/api/ambulance/air-status',{id:ID,phone:PH}).then(function(s){$('e').textContent='';var r=$('r');r.hidden=false;
 r.innerHTML='<p>Booking '+s.id+'</p><p class="st">'+(s.cancelled?'Cancelled':SL[s.stage]||s.stage)+'</p>'+(s.final?brk(s):'<p style="margin-top:8px">Booking amount paid '+inr(s.fee)+'. The final price will be shown here after the airline approves.</p>')+
 (s.cancelled&&s.refund?'<p class="ok">Refund of '+inr(s.refund)+' will be sent to you.</p>':'')+
 (s.canPay?'<button class="b" id="pay">Pay balance '+inr(s.balance)+'</button>':'')+(s.canCancel?'<br><button class="b r" id="can">Cancel booking</button>':'')+'<p id="m" style="margin-top:8px"></p>';
 if($('pay'))$('pay').onclick=function(){pay(s)};
 if($('can'))$('can').onclick=function(){if(confirm('Cancel this booking? Refund: '+inr(s.refund)+' (a processing fee of '+inr(s.procFee||FEE)+' is kept).'))post('/api/ambulance/air-cancel',{id:ID,phone:PH}).then(load).catch(function(x){$('m').textContent=x.message})};
}).catch(function(x){$('r').hidden=true;$('e').textContent=x.message})}
function pay(s){var m=$('m');$('pay').disabled=true;m.textContent='Please wait...';
 post('/api/ambulance/air-pay-start',{id:ID,phone:PH}).then(function(o){
  if(o.demo)return post('/api/ambulance/air-pay-confirm',{id:ID,phone:PH}).then(load);
  var sc=document.createElement('script');sc.src='https://checkout.razorpay.com/v1/checkout.js';
  sc.onload=function(){new Razorpay({key:o.keyId,amount:o.amount*100,currency:'INR',order_id:o.orderId,name:'Ghar to Health',description:'Airline transfer balance',theme:{color:'#087cf2'},
   handler:function(r){post('/api/ambulance/air-pay-confirm',{id:ID,phone:PH,razorpay_payment_id:r.razorpay_payment_id,razorpay_order_id:r.razorpay_order_id,razorpay_signature:r.razorpay_signature}).then(load).catch(function(x){m.textContent=x.message})},
   modal:{ondismiss:function(){$('pay').disabled=false;m.textContent=''}}}).open()};document.head.appendChild(sc)
 }).catch(function(x){m.textContent=x.message;$('pay').disabled=false})}
$('f').onsubmit=function(e){e.preventDefault();ID=$('i').value.trim().toUpperCase();PH=$('p').value.replace(/\D/g,'');load()};
(function(){try{var q=new URLSearchParams(location.search).get('id'),ph=sessionStorage.getItem('airPh')||'';if(q)$('i').value=q.toUpperCase();if(ph)$('p').value=ph;if(q&&ph.length>=10)$('f').onsubmit({preventDefault:function(){}})}catch(x){}})();
</script></body></html>
