<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Ghar to Health</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f7fbff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:min(380px,92vw);background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid #d9ebf8}
h2{margin:0 0 20px;color:#12365d}
label{display:block;margin:12px 0 5px;font-weight:600;color:#375775}
input{width:100%;padding:11px;border:1px solid #cfe0ee;border-radius:8px;font:inherit}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#087cf2;color:#fff;font-weight:700;cursor:pointer}
#error{color:#c62828;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>🔒 Admin Login</h2>
<label>Admin ID</label>
<input id="user" type="text" placeholder="Enter Admin ID">
<label>Password</label>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
<div id="error"></div>
</div>
<script>
function login(){
  var user=document.getElementById('user').value.trim();
  var pass=document.getElementById('pass').value;
  if(user==='GhartoHealth' && pass==='GhartoHealth@010106'){
    sessionStorage.setItem('adminKey','GhartoHealth@010106');
    window.location.href='admin.html';
  }else{
    document.getElementById('error').textContent='Wrong Admin ID or Password';
  }
}
</script>
</body>
</html>
