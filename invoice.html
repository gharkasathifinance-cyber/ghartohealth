<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice - Ghar to Health</title>
<style>
  :root{
    --teal:#0a4fa8; --blue:#087cf2; --ink:#0a2a4d; --muted:#5b7690;
    --line:#d9ebf8; --soft:#eef7ff; --paper:#ffffff; --bg:#cceeff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#e8f8ff,#cceeff 55%,#a8defb) fixed;color:var(--ink);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{max-width:820px;margin:18px auto 0;padding:0 12px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;padding:11px 22px;font:600 15px "Segoe UI",Arial,sans-serif;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
  .btn:focus-visible{outline:3px solid #7fb6ff;outline-offset:2px}
  .sample{max-width:820px;margin:10px auto 0;padding:8px 14px;background:#fff4dc;border:1px solid #f6d58f;
    color:#8a5a00;border-radius:8px;font-size:13px}
  .sheet{max-width:820px;margin:14px auto 40px;background:var(--paper);border-radius:10px;
    box-shadow:0 2px 14px rgba(10,60,70,.12);overflow:hidden;position:relative}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    padding:28px 32px 22px;border-bottom:4px solid var(--teal)}
  .brand{display:flex;gap:12px;align-items:center}
  .brand b{display:block;font-size:22px;color:var(--teal);line-height:1.15}
  .brand span{font-size:13px;color:var(--muted)}
  .doc{text-align:right}
  .doc h1{margin:0;font-size:28px;letter-spacing:.5px;color:var(--ink)}
  .doc p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--soft);
    border-bottom:1px solid var(--line)}
  .meta div{padding:12px 14px 12px 16px;border-right:1px solid var(--line)}
  .meta div:first-child{padding-left:32px}
  .meta div:last-child{border-right:0}
  .meta small{display:block;color:var(--muted);font-size:12px}
  .meta strong{font-size:14px;overflow-wrap:anywhere}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:22px 32px}
  .parties h3{margin:0 0 6px;font-size:13px;color:var(--teal)}
  .parties p{margin:0;font-size:14px}
  table{width:calc(100% - 64px);margin:0 32px;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:9px 8px;border-bottom:2px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th.r,td.r{text-align:right;white-space:nowrap}
  .tax{color:var(--muted);font-size:12px}
  .sum{display:flex;justify-content:flex-end;padding:14px 32px 6px}
  .sum table{width:340px;margin:0}
  .sum td{border:0;padding:5px 8px}
  .sum tr.total td{border-top:2px solid var(--teal);padding-top:11px;font-size:19px;font-weight:700;color:var(--teal)}
  .paid{display:inline-block;border:2.5px solid #1a8a4a;color:#1a8a4a;border-radius:6px;
    padding:2px 12px;font-weight:700;font-size:18px;transform:rotate(-6deg);margin:6px 0 0 32px}
  .paid.due{border-color:#c77700;color:#c77700}
  .notes{margin:12px 32px 0;padding:12px 14px;background:var(--soft);border-left:4px solid var(--blue);
    border-radius:4px;font-size:13.5px}
  .foot{margin-top:22px;padding:16px 32px 22px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .err{padding:40px 32px;text-align:center;color:var(--muted)}
  @media (max-width:640px){
    .top,.parties{flex-direction:column;grid-template-columns:1fr;padding-left:16px;padding-right:16px}
    .doc{text-align:left}
    .meta{grid-template-columns:1fr 1fr}
    .meta div,.meta div:first-child{padding-left:16px}
    table{width:calc(100% - 32px);margin:0 16px}
    .sum{padding:14px 16px 6px}.sum table{width:100%}
    .notes{margin:12px 16px 0}.foot{padding:16px}.paid{margin-left:16px}
  }
  @page{size:A4;margin:10mm}
  @media print{
    body{background:#fff!important}
    .bar,.sample{display:none}
    .sheet{box-shadow:none;border-radius:0;margin:0;max-width:none}
  }

  .demo{background:#fff4dc;color:#8a5a00;border-bottom:1px solid #f6d58f;font-size:12.5px;text-align:center;padding:6px 12px}
  .tw{overflow-x:auto;margin:0 32px}
  .tw table{width:100%;margin:0;font-size:13px}
  .items thead th{background:var(--soft)}
  .words{margin:4px 32px 0;font-size:13.5px}
  .words b{color:var(--ink)}
  .legal{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:18px 32px 0;font-size:12.5px;color:var(--muted)}
  .legal h3{margin:0 0 6px;font-size:12.5px;color:var(--teal)}
  .legal ol{margin:0;padding-left:18px}.legal li{margin:2px 0}
  .legal p{margin:2px 0}
  .signrow{display:flex;justify-content:flex-end;margin:16px 32px 0}
  .sign{text-align:center;min-width:210px;font-size:12.5px;color:var(--muted)}
  .sign b{color:var(--ink);display:block}
  .sign .line{border-bottom:1px solid var(--line);height:34px;margin-bottom:4px}
  @media (max-width:640px){
    .tw{margin:0 16px}.tw table{min-width:600px}
    .words{margin:4px 16px 0}
    .legal{grid-template-columns:1fr;margin:16px 16px 0}
    .signrow{margin:16px 16px 0}
  }
  @media print{ .tw{overflow:visible}.tw table{min-width:0}.legal,.signrow,.items tr{break-inside:avoid} }
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v,def){var n=parseFloat(v);return isNaN(n)?def:n;}
function r2(n){return Math.round(n*100)/100;}
function inr(n){return '\u20B9' + Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}

function pickCategory(d){
  if(d.category && CATEGORIES[d.category]) return d.category;
  if(/ambulance/i.test(d.service||'')) return 'ambulance';
  if(/doctor|medicine|lab|health|nurse|physio|dental|eye|mental|diet|scan/i.test(d.service||'')) return 'medical';
  return 'home';
}

function calc(d){
  var key = pickCategory(d), cat = CATEGORIES[key];
  if(Array.isArray(d.charges)){            /* saved invoice: use the exact amounts the server stored */
    var its = (d.items||[]).map(function(i){var q=num(i.qty,1),r=num(i.rate,0);
      return {label:i.label||'Service',qty:q,rate:r,amount:r2(q*r),gstPct:0};});
    var sub = r2(its.reduce(function(s,i){return s+i.amount;},0));
    return {key:key, cat:cat, items:its, subtotal:sub, chargeRows:d.charges,
            total:d.total!=null?num(d.total,0):r2(sub+d.charges.reduce(function(s,c){return s+num(c.amount,0);},0))};
  }
  var itemGst = num(d.itemGstPct, cat.itemGstPct);
  var items = (d.items||[]).map(function(i){
    var qty = num(i.qty!=null?i.qty:i.quantity, 1);
    var rate = i.rate!=null ? num(i.rate,0) : (i.price!=null ? num(i.price,0) : num(i.amount,0)/qty);
    var amount = i.amount!=null ? num(i.amount,0) : r2(qty*rate);
    return {label:i.label||i.description||i.name||'Service', qty:qty, rate:rate, amount:amount,
            gstPct:num(i.gstPct, itemGst)};
  });
  var subtotal = r2(items.reduce(function(s,i){return s+i.amount;},0));
  var gst = r2(items.reduce(function(s,i){return s+i.amount*i.gstPct/100;},0));
  var fee;
  if(d.feeAmount!=null) fee = num(d.feeAmount,0);
  else if(d.feePct!=null) fee = subtotal*num(d.feePct,0)/100;
  else if(cat.feeAmount!=null) fee = cat.feeAmount;
  else fee = subtotal*num(cat.feePct,0)/100;
  fee = r2(fee);
  var feeGstPct = num(d.feeGstPct!=null?d.feeGstPct:(key==='ambulance'&&d.gstPct!=null?d.gstPct:null), cat.feeGstPct);
  var feeGst = r2(fee*feeGstPct/100);
  return {key:key, cat:cat, items:items, subtotal:subtotal, gst:gst, fee:fee, feeGstPct:feeGstPct,
          feeGst:feeGst, total:r2(subtotal+gst+fee+feeGst)};
}

var ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
var TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function two(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');}
function three(n){var s='';if(n>=100){s=ONES[Math.floor(n/100)]+' Hundred';n=n%100;if(n)s+=' and ';}return s+(n?two(n):'');}
function inWords(amount){                       /* Indian system: Thousand, Lakh, Crore */
  var t=Math.round(amount*100), rs=Math.floor(t/100), ps=t%100, p=[];
  var cr=Math.floor(rs/10000000), lk=Math.floor(rs%10000000/100000), th=Math.floor(rs%100000/1000), rest=rs%1000;
  if(cr)p.push(three(cr)+' Crore'); if(lk)p.push(two(lk)+' Lakh'); if(th)p.push(two(th)+' Thousand'); if(rest)p.push(three(rest));
  var s=(p.length?p.join(' '):'Zero')+' Rupees';
  if(ps)s+=' and '+two(ps)+' Paise';
  return s+' Only';
}

function render(d){
  var c = calc(d);
  var client = d.client || {name:d.name, mobile:d.mobile||d.phone, address:d.address};
  var dt = new Date(d.date||Date.now());
  if(isNaN(dt)) dt = new Date();
  var dateStr = dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  var status = String(d.status||'PAID').toUpperCase();

  /* GST is shown as CGST + SGST; other charges (platform fee etc.) stay separate */
  var gst = 0, others = [];
  if(c.chargeRows){
    c.chargeRows.forEach(function(x){
      var a = num(x.amount,0); if(!a) return;
      if(/^\s*gst\s*$/i.test(x.label||'')) gst += a; else others.push({label:x.label, amount:a});
    });
  } else {
    gst = c.gst;
    if(c.fee>0) others.push({label:'Platform fee', amount:c.fee});
    if(c.feeGst>0) others.push({label:'GST ('+c.feeGstPct+'% on platform fee)', amount:c.feeGst});
  }
  gst = r2(gst);
  var hasTax = gst>0, pct = (hasTax && c.subtotal>0) ? r2(gst*100/c.subtotal) : 0, half = r2(pct/2);
  var sac = c.cat.sac || '';

  var left = gst, cgT = 0, sgT = 0;
  var rows = c.items.map(function(i,ix){
    var t = 0;
    if(hasTax){
      if(c.chargeRows) t = (ix===c.items.length-1) ? r2(left) : r2(gst*i.amount/c.subtotal);
      else t = r2(i.amount*i.gstPct/100);
      left = r2(left - t);
    }
    var cg = r2(t/2), sg = r2(t-cg); cgT += cg; sgT += sg;
    return {i:i, cg:cg, sg:sg, tot:r2(i.amount+cg+sg)};
  });
  cgT = r2(cgT); sgT = r2(sgT);

  var head = '<th>Description</th>'+(sac?'<th>SAC</th>':'')+'<th class="r">Qty</th><th class="r">Rate</th>'+
    (hasTax ? '<th class="r">Taxable</th><th class="r">CGST ('+half+'%)</th><th class="r">SGST ('+half+'%)</th>' : '')+'<th class="r">Amount</th>';
  var body = rows.map(function(r){
    return '<tr><td>'+esc(r.i.label)+'</td>'+(sac?'<td>'+esc(sac)+'</td>':'')+
      '<td class="r">'+esc(r.i.qty)+'</td><td class="r">'+inr(r.i.rate)+'</td>'+
      (hasTax ? '<td class="r">'+inr(r.i.amount)+'</td><td class="r">'+inr(r.cg)+'</td><td class="r">'+inr(r.sg)+'</td><td class="r">'+inr(r.tot)+'</td>'
              : '<td class="r">'+inr(r.i.amount)+'</td>')+'</tr>';
  }).join('');

  var sum = '<tr><td>'+(hasTax?'Taxable value':'Subtotal')+'</td><td class="r">'+inr(c.subtotal)+'</td></tr>';
  if(hasTax){
    sum += '<tr><td>CGST ('+half+'%)</td><td class="r">'+inr(cgT)+'</td></tr>'+
           '<tr><td>SGST ('+half+'%)</td><td class="r">'+inr(sgT)+'</td></tr>';
  }
  others.forEach(function(x){ sum += '<tr><td>'+esc(x.label)+'</td><td class="r">'+inr(x.amount)+'</td></tr>'; });
  sum += '<tr class="total"><td>Total'+(status==='PAID'?' paid':'')+'</td><td class="r">'+inr(c.total)+'</td></tr>';

  var logo = '<img src="'+esc(COMPANY.logo)+'" alt="Ghar to Health logo" style="width:64px;height:64px;object-fit:contain;flex:none">';
  var payCell = d.paymentId
    ? '<div><small>Payment ID</small><strong>'+esc(d.paymentId)+'</strong></div>'
    : '<div><small>Payment</small><strong>'+esc(d.paymentMode||'As agreed')+'</strong></div>';

  var terms = [];
  terms.push('All disputes are subject to '+esc(COMPANY.jurisdiction||'local')+' jurisdiction only.');
  terms.push(COMPANY.registered ? 'This document is a valid GST Tax Invoice under the CGST/SGST Act, 2017.'
                                : 'This is a demo invoice issued before GST registration. It is not a tax invoice.');
  terms.push('This is a computer-generated invoice.');
  var co = ['<p><b>'+esc(COMPANY.name)+'</b></p>', '<p>Regd. Office: '+esc(COMPANY.address)+'</p>'];
  if(COMPANY.gstin) co.push('<p>GSTIN: '+esc(COMPANY.gstin)+'</p>');
  if(COMPANY.pan) co.push('<p>PAN: '+esc(COMPANY.pan)+'</p>');
  if(COMPANY.cin) co.push('<p>CIN: '+esc(COMPANY.cin)+'</p>');
  if(COMPANY.state) co.push('<p>State: '+esc(COMPANY.state)+(hasTax?' | Intra-State supply':'')+'</p>');

  document.getElementById('sheet').innerHTML =
   (COMPANY.registered?'':'<div class="demo">Demo invoice: company registration is in progress. Registration numbers are placeholders.</div>')+
   '<div class="top"><div class="brand">'+logo+
     '<div><b>'+esc(COMPANY.name)+'</b><span>'+esc(COMPANY.tagline)+'</span></div></div>'+
     '<div class="doc"><h1>'+(COMPANY.registered?'Tax Invoice':'Invoice')+'</h1>'+(COMPANY.registered&&COMPANY.gstin?'<p>GSTIN: '+esc(COMPANY.gstin)+'</p>':'')+'</div></div>'+
   '<div class="meta">'+
     '<div><small>Invoice no.</small><strong>'+esc(d.invoiceNo)+'</strong></div>'+
     '<div><small>Invoice date</small><strong>'+esc(dateStr)+'</strong></div>'+
     '<div><small>Booking ID</small><strong>'+esc(d.bookingId)+'</strong></div>'+
     payCell+'</div>'+
   '<div class="parties"><div><h3>Billed to</h3><p><b>'+esc(client.name)+'</b><br>Mobile: '+
     esc(client.mobile)+'<br>'+esc(client.address)+'</p></div>'+
     '<div><h3>Service booked</h3><p><b>'+esc(d.service||'')+'</b>'+
     (d.schedule?'<br>'+esc(d.schedule):'')+
     '<br>Payment mode: '+esc(d.paymentMode||'Online')+'</p></div></div>'+
   '<div class="tw"><table class="items"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
   '<div class="sum"><table>'+sum+'</table></div>'+
   '<div class="words">Amount in words: <b>'+esc(inWords(c.total))+'</b></div>'+
   '<span class="paid'+(status==='PAID'?'':' due')+'">'+esc(status)+'</span>'+
   (c.cat.note?'<div class="notes">'+esc(c.cat.note)+'</div>':'')+
   '<div class="legal"><div><h3>Terms &amp; conditions</h3><ol>'+terms.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ol></div>'+
     '<div><h3>Company details</h3>'+co.join('')+'</div></div>'+
   '<div class="signrow"><div class="sign"><div class="line"></div><b>For '+esc(COMPANY.name)+'</b>Authorized Signatory</div></div>'+
   '<div class="foot"><span>'+esc(COMPANY.name)+', '+esc(COMPANY.address)+'</span>'+
     '<span>'+(/00000/.test(COMPANY.phone)?'':esc(COMPANY.phone)+' | ')+esc(COMPANY.email)+(COMPANY.website?' | '+esc(COMPANY.website):'')+'</span>'+
     '<span>This is a computer-generated invoice.</span></div>';
}

function fail(msg){
  document.getElementById('sheet').innerHTML = '<div class="err">'+esc(msg)+'</div>';
}

(function start(){
  if(window.GTH_INVOICE) return render(window.GTH_INVOICE.invoice);   /* server embedded this invoice */
  var q = new URLSearchParams(location.search);
  var s = q.get('sample');
  if(s && SAMPLES[s]){ document.getElementById('sampleNote').hidden = false; return render(SAMPLES[s]); }

  var id = q.get('id'), no = q.get('no');
  if(no){                                   /* admin view */
    var key = ''; try{ key = sessionStorage.getItem('adminKey') || localStorage.getItem('adminKey') || ''; }catch(e){}
    if(!key) key = prompt('Admin key') || '';
    fetch('/api/admin/invoices/data?no=' + encodeURIComponent(no), {headers:{'x-admin-key':key}})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(j){ render(j.invoice); })
      .catch(function(){ fail('Invoice not found, or wrong admin key.'); });
    return;
  }
  if(id){                                   /* client view */
    var ph = q.get('phone') || prompt('Enter the mobile number used for this booking') || '';
    fetch(INVOICE_API + '?format=json&id=' + encodeURIComponent(id) + '&phone=' + encodeURIComponent(ph))
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(j){ render(j.invoice || j); })
      .catch(function(){ fail('Invoice not found. Please check the Booking ID and mobile number.'); });
    return;
  }

  try{
    var raw = sessionStorage.getItem('gth_invoice') || localStorage.getItem('gth_invoice');
    if(raw) return render(JSON.parse(raw));
  }catch(e){}

  document.getElementById('sampleNote').hidden = false;
  render(SAMPLES.home);
})();
</script>
</body>
</html>
