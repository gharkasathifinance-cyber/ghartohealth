<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice - Ghar to Health</title>
<style>
  :root{
    --teal:#0a4fa8; --blue:#087cf2; --ink:#0a2a4d; --muted:#5b7690;
    --line:#d9ebf8; --soft:#eef7ff; --paper:#ffffff; --bg:#cceeff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#e8f8ff,#cceeff 55%,#a8defb) fixed;color:var(--ink);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{max-width:820px;margin:18px auto 0;padding:0 12px;display:flex;gap:10px;justify-content:flex-end}
  .btn{border:0;border-radius:999px;padding:11px 22px;font:600 15px "Segoe UI",Arial,sans-serif;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
  .btn:focus-visible{outline:3px solid #7fb6ff;outline-offset:2px}
  .sheet{max-width:820px;margin:14px auto 40px;background:var(--paper);border-radius:10px;
    box-shadow:0 2px 14px rgba(10,60,70,.12);overflow:hidden;position:relative}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    padding:28px 32px 22px;border-bottom:4px solid var(--teal)}
  .brand{display:flex;gap:12px;align-items:center}
    .brand b{display:block;font-size:22px;color:var(--teal);line-height:1.15}
  .brand span{font-size:13px;color:var(--muted)}
  .doc{text-align:right}
  .doc h1{margin:0;font-size:28px;letter-spacing:.5px;color:var(--ink)}
  .doc p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--soft);
    border-bottom:1px solid var(--line)}
  .meta div{padding:12px 32px 12px 16px;border-right:1px solid var(--line)}
  .meta div:first-child{padding-left:32px}
  .meta div:last-child{border-right:0}
  .meta small{display:block;color:var(--muted);font-size:12px}
  .meta strong{font-size:14px;word-break:break-all}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:22px 32px}
  .parties h3{margin:0 0 6px;font-size:13px;color:var(--teal)}
  .parties p{margin:0;font-size:14px}
  table{width:calc(100% - 64px);margin:0 32px;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:9px 8px;border-bottom:2px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th.r,td.r{text-align:right;white-space:nowrap}
  .tax{color:var(--muted);font-size:12px}
  .sum{display:flex;justify-content:flex-end;padding:14px 32px 6px}
  .sum table{width:340px;margin:0}
  .sum td{border:0;padding:5px 8px}
  .sum tr.total td{border-top:2px solid var(--teal);padding-top:11px;font-size:19px;font-weight:700;color:var(--teal)}
  .paid{display:inline-block;border:2.5px solid #1a8a4a;color:#1a8a4a;border-radius:6px;
    padding:2px 12px;font-weight:700;font-size:18px;transform:rotate(-6deg);margin:6px 0 0 32px}
  .notes{margin:12px 32px 0;padding:12px 14px;background:var(--soft);border-left:4px solid var(--blue);
    border-radius:4px;font-size:13.5px}
  .foot{margin-top:22px;padding:16px 32px 22px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  @media (max-width:640px){
    .top,.parties{flex-direction:column;grid-template-columns:1fr;padding-left:16px;padding-right:16px}
    .doc{text-align:left}
    .meta{grid-template-columns:1fr 1fr}
    .meta div,.meta div:first-child{padding-left:16px}
    table{width:calc(100% - 32px);margin:0 16px}
    .sum{padding:14px 16px 6px}.sum table{width:100%}
    .notes{margin:12px 16px 0}.foot{padding:16px}.paid{margin-left:16px}
  }
  @page{size:A4;margin:10mm}
  @media print{
    body{background:#fff!important}
    .bar{display:none}
    .sheet{box-shadow:none;border-radius:0;margin:0;max-width:none}
  }
</style>
</head>
<body>

<div class="bar">
  <button class="btn ghost" onclick="location.href='/'">Back to home</button>
  <button class="btn ghost" onclick="location.href='track.html'">Track booking</button>
  <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
</div>

}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function inr(n){return '\u20B9' + Math.round(n).toLocaleString('en-IN');}

function render(d){
  var serviceTotal = d.items.reduce(function(s,i){return s + Number(i.amount||0);},0);
  var fee = Math.round(serviceTotal * (d.feePct||0) / 100);
  var gst = Math.round(fee * (d.gstPct||0) / 100);
  var total = serviceTotal + fee + gst;
  var dt = new Date(d.date);
  var dateStr = dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

  var rows = d.items.map(function(i){
    return '<tr><td>'+esc(i.label)+'<div class="tax">SAC '+esc(COMPANY.serviceSac)+'</div></td>'+
           '<td class="r">Exempt</td><td class="r">'+inr(i.amount)+'</td></tr>';
  }).join('');
  rows += '<tr><td>Platform and booking fee ('+esc(d.feePct)+'%)'+
          (COMPANY.feeSac?'<div class="tax">SAC '+esc(COMPANY.feeSac)+'</div>':'')+'</td>'+
          '<td class="r">'+esc(d.gstPct)+'%</td><td class="r">'+inr(fee)+'</td></tr>';

  var logo = '<img src="'+esc(COMPANY.logo)+'" alt="Ghar to Health logo" style="width:64px;height:64px;object-fit:contain;flex:none">';

  document.getElementById('sheet').innerHTML =
   '<div class="top"><div class="brand">'+logo+
     '<div><b>'+esc(COMPANY.name)+'</b><span>'+esc(COMPANY.tagline)+'</span></div></div>'+
     '<div class="doc"><h1>Invoice</h1><p>GSTIN: '+esc(COMPANY.gstin)+'</p></div></div>'+
   '<div class="meta">'+
     '<div><small>Invoice no.</small><strong>'+esc(d.invoiceNo)+'</strong></div>'+
     '<div><small>Invoice date</small><strong>'+esc(dateStr)+'</strong></div>'+
     '<div><small>Booking ID</small><strong>'+esc(d.bookingId)+'</strong></div>'+
     '<div><small>Payment ID</small><strong>'+esc(d.paymentId)+'</strong></div></div>'+
   '<div class="parties"><div><h3>Billed to</h3><p><b>'+esc(d.client.name)+'</b><br>Mobile: '+
     esc(d.client.mobile)+'<br>'+esc(d.client.address)+'</p></div>'+
     '<div><h3>Service booked</h3><p><b>'+esc(d.service)+'</b><br>'+esc(d.schedule||'')+
     '<br>Payment mode: '+esc(d.paymentMode||'Online')+'</p></div></div>'+
   '<table><thead><tr><th>Description</th><th class="r">GST</th><th class="r">Amount</th></tr></thead><tbody>'+
     rows+'</tbody></table>'+
   '<div class="sum"><table>'+
     '<tr><td>Service total (GST exempt)</td><td class="r">'+inr(serviceTotal)+'</td></tr>'+
     '<tr><td>Platform and booking fee</td><td class="r">'+inr(fee)+'</td></tr>'+
     '<tr><td>GST ('+esc(d.gstPct)+'% on platform fee)</td><td class="r">'+inr(gst)+'</td></tr>'+
     '<tr class="total"><td>Total paid</td><td class="r">'+inr(total)+'</td></tr></table></div>'+
   '<span class="paid">'+esc(d.status||'PAID')+'</span>'+
   '<div class="notes">If a technical error occurs, the payment will be refunded to your bank account within 4 days. '+
     'In an emergency, please call 108 first.</div>'+
   '<div class="foot"><span>'+esc(COMPANY.name)+', '+esc(COMPANY.address)+'</span>'+
     '<span>'+esc(COMPANY.phone)+' | '+esc(COMPANY.email)+'</span>'+
     '<span>This is a computer-generated invoice.</span></div>';
}
render(load());
</script>
</body>
</html>
